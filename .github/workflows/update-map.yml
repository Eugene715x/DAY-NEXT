name: Refresh Beatty map

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-map.yml
      - scripts/refresh-map.mjs
      - scripts/lib/osm-download.mjs

permissions:
  contents: write

concurrency:
  group: beatty-map-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download original OSM data and convert every source object
        run: npm run map:refresh
      - name: Check geometry, coverage and navigation
        run: npm test
      - name: Build the offline game
        run: npm run build
      - name: Publish source, provenance and playable downloads
        run: |
          git add maps/usa.js maps/source/beatty.osm maps/source/beatty.provenance.json maps/source/coverage.json downloads/day-next.html downloads/day-next.zip
          if git diff --cached --quiet; then
            echo 'Map and build are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh Beatty OSM source and offline game'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beatty-map-and-game
          path: |
            maps/source/beatty.osm
            maps/source/beatty.provenance.json
            maps/source/coverage.json
            downloads/day-next.zip
          retention-days: 14
